# @package _global_
defaults:
  - /experiment/mammaprint_bc: test_mil_regression
  - /trainer/callbacks:
    - attention_visualizer
  - _self_

ml:
  net:
    model_uri: mlflow-artifacts:/17/830aa070a7d34f50964a4094e83446fd/artifacts/model/MLFlowModelCheckpoint/MIL_Mammaprint_value_best
datamodule:
  datasets:
    test:
      sampler:
        index_levels:
          - slide_name
      label: "mammaprint"
  dataloaders_kwargs:
    test:
      num_workers: 12
      batch_size: 8

trainer:
  callbacks:
    attention_visualizer:
      save_dir: test_heatmaps

metadata:
  experiment_name: mammaprint
  run_name: MIL mammaprint test whole slide images with Heatmaps, using the gated attention model, best model configuration
  description: |
    mammaprint Heatmaps.
  hyperparameters:
    num_workers: 15
    batch_size: 16
   