# @package _global_
defaults:
  - /experiment/mammaprint_bc: test_mil
  - /trainer/callbacks:
    - heatmap_visualizer
  - _self_

ml:
  net:
    model_uri: mlflow-artifacts:/17/2ccc1446e1a042cf968d9558a720c73d/artifacts/model/MLFlowModelCheckpoint/MIL_binary_best
datamodule:
  datasets:
    test:
      sampler:
        index_levels:
          - slide_name
      label: "luminal_id"
  dataloaders_kwargs:
    test:
      num_workers: 12
      batch_size: 8

trainer:
  callbacks:
    heatmap_visualizer:
      save_dir: test_heatmaps

metadata:
  experiment_name: mammaprint
  run_name: MIL Luminal test whole slide images with Heatmaps, using the gated attention model
  description: |
    Luminal binary classification.
  hyperparameters:
    num_workers: 15
    batch_size: 16
   