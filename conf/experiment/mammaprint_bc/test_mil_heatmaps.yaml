# @package _global_
defaults:
  - /experiment/mammaprint_bc: test_mil
  - /trainer/callbacks:
    - heatmap_visualizer
  - _self_

ml:
  net:
    model_uri: mlflow-artifacts:/17/8d3ae32b3a5b43b9b08712fb777b3dd7/artifacts/model/MLFlowModelCheckpoint/last
datamodule:
  datasets:
    test:
      sampler:
        index_levels:
          - slide_name
      label: "is_cancer"
  dataloaders_kwargs:
    test:
      num_workers: 15
      batch_size: 16

trainer:
  callbacks:
    heatmap_visualizer:
      save_dir: test_heatmaps

metadata:
  experiment_name: mammaprint
  run_name: MIL Prostate test whole slide images with Heatmaps, using the gated attention model
  description: |
    Prostate binary classification.
  hyperparameters:
    num_workers: 15
    batch_size: 16
   