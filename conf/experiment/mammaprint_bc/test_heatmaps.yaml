# @package _global_
defaults:
  - /experiment/mammaprint_bc: test
  - /trainer/callbacks:
    - slide_predictor
    - heatmap_visualizer
  - _self_


datamodule:
  datasets:
    test:
      sampler:
        index_levels:
          - slide_name
      label: "luminal_id"
  dataloaders_kwargs:
    test:
      num_workers: 12
      batch_size: 40

ml:
  net:
    model_uri: mlflow-artifacts:/17/164d674c95994dc7ba426e8904730bfe/artifacts/model/MLFlowModelCheckpoint/vgg16_mammaprint_best

trainer:
  callbacks:
    heatmap_visualizer:
      save_dir: test_heatmaps

metadata:
  experiment_name: Mamma-print
  run_name: Test # Luminal-type ResNet101 after segmentation Testing slide prediction with Heatmaps
  description: |
    Luminal binary classification test VGG16, Mask 38 with prediction heatmap generation.
  hyperparameters:
    # tested with ~ 8 GiB Memory, 8 cpus
    batch_size: ${datamodule.dataloaders_kwargs.test.batch_size}
