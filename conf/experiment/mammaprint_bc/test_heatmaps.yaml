# @package _global_
defaults:
  - /experiment/mammaprint_bc: test
  - /trainer/callbacks:
    - heatmap_visualizer
  - _self_


datamodule:
  datasets:
    test:
      sampler:
        index_levels:
          - slide_name
      label: "luminal_id"
  dataloaders_kwargs:
    test:
      num_workers: 12
      batch_size: 40

ml:
  net:
    model_uri: mlflow-artifacts:/17/b603e140ea644ad8bb396826166484cb/artifacts/model/MLFlowModelCheckpoint/vgg16_mammaprint_best

trainer:
  callbacks:
    heatmap_visualizer:
      save_dir: test_heatmaps
    slide_predictor:
      _target_: mammaprint.trainer.callbacks.SlidePredictor
      save_dir: slide_predictions
      mask_size: 20
      threshold: 0.212661
      ground_truth_col: luminal_id

metadata:
  experiment_name: Mamma-print
  run_name: After TC VGG16 Test heatmaps # Luminal-type ResNet101 after segmentation Testing slide prediction with Heatmaps
  description: |
    Luminal binary classification test VGG16, Mask 20 with prediction heatmap generation.
  hyperparameters:
    # tested with ~ 8 GiB Memory, 8 cpus
    batch_size: ${datamodule.dataloaders_kwargs.test.batch_size}
