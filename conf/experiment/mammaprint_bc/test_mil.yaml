# @package _global_
defaults:
  - /datamodule: wsi
  - /datamodule/data_sources: mil_luminal_test
  - /datamodule/datasets@datamodule.datasets.test: mil_dataset
  - /datamodule/datasets/sampler@datamodule.datasets.test.sampler: mil_test_tree
  - /datamodule/datasets/augmentations@datamodule.datasets.test.augmentations: normalize
  - /ml: mammaprint
  - /ml/net: saved_model
  - /ml/output_activation: sigmoid
  - /ml/metrics:
    - binary_accuracy
    - binary_auroc
    - binary_recall
    - binary_specificity
  - _self_

ml:
  net:
    model_uri: mlflow-artifacts:/17/d79edc51a0334507aa4c35bb08d6205d/artifacts/model/MLFlowModelCheckpoint/last

datamodule:
  datasets:
    test:
      sampler:
        index_levels:
          - slide_name
      label: "is_cancer"
  dataloaders_kwargs:
    test:
      num_workers: 15
      batch_size: 16

metadata:
  experiment_name: mammaprint
  run_name: MIL test whole slide images
  description: |
    Binary classification.
  hyperparameters:
    num_workers: 15
    batch_size: 16
   