# @package _global_
defaults:
  - /datamodule: wsi
  - /datamodule/data_sources:
    - mammaprint_segmentation
    - mammaprint_test
  # Train dataset
  - /datamodule/datasets@datamodule.datasets.train: base_dataset
  - /datamodule/datasets/sampler@datamodule.datasets.train.sampler: random_tree
  - /datamodule/datasets/augmentations@datamodule.datasets.train.augmentations: her_transforms
  # Valid dataset
  - /datamodule/datasets@datamodule.datasets.valid: base_dataset
  - /datamodule/datasets/sampler@datamodule.datasets.valid.sampler: random_tree
  - /datamodule/datasets/augmentations@datamodule.datasets.valid.augmentations: normalize
  - /ml: mammaprint
  - /ml/optimizer: adam
  - /ml/net: vgg16_regression
  - /ml/output_activation: identity
  - /ml/loss: mse
  - /ml/metrics:
    - r2_score
    - pearson_corr_coef
    - spearman_corr_coef
    - mse
    - mae
  - /ml/lr_scheduler: reduce_lr_on_plateau
  - /trainer/callbacks:
    - log_best_model
    - early_stopping
    - lr_monitor
  - _self_


datamodule:
  data_sources:
    mammaprint:
      splits:
        train: 0.8
        valid: 0.2

  datasets:
    train:
      sampler:
        epoch_size: 80_000
        index_levels:
          - luminal_id
          - slide_name
      label: "mammaprint_value"

    valid:
      sampler:
        epoch_size: 20_000
        index_levels:
          - luminal_id
          - slide_name
      label: "mammaprint_value"

  dataloaders_kwargs:
    train:
      num_workers: 8
      batch_size: 32
    valid:
      num_workers: 8
      batch_size: 32

ml:
  net:
    regression:
      width: 512
      height: 512
      weights: IMAGENET1K_V1
  optimizer:
    lr: 5e-5
    weight_decay: 5e-05
  lr_scheduler:
    monitor: valid/loss
    scheduler:
      mode: min
      factor: 0.5
      patience: 3

trainer:
  max_epochs: 20
  log_every_n_steps: 20
  logger:
    log_model: all
  callbacks:
    early_stopping:
      monitor: valid/loss
      mode: min
      patience: 5
    log_best_model:
      monitor: valid/loss
      mode: min
      filename: vgg16_mammaprint_value_best



metadata:
  experiment_name: Mamma-print
  run_name: VGG16 Regression training after using tissue classification model on tiles
  description: |
    Luminal binary classification.
  hyperparameters:
    # Scaled for V40 GPU
    # tested with 24 GiB Memory, 8 cpus (set request=limits in k8s)
    # Expect around 50tiles/s
    # most time is spent in reading WSI regions (tiles) from disk
    max_epochs: ${trainer.max_epochs}
    train_epoch_size: ${datamodule.datasets.train.sampler.epoch_size}
    valid_epoch_size: ${datamodule.datasets.valid.sampler.epoch_size}
    lr: ${ml.optimizer.lr}
    weight_decay: ${ml.optimizer.weight_decay}
    batch_size: ${datamodule.dataloaders_kwargs.train.batch_size}
