# @package _global_
defaults:
  - /datamodule: wsi
  - /datamodule/data_sources:
    - mammaprint_without_valid
    - mammaprint_test
  # Train dataset
  - /datamodule/datasets@datamodule.datasets.train: base_classification
  - /datamodule/datasets/sampler@datamodule.datasets.train.sampler: random_tree
  - /datamodule/datasets/augmentations@datamodule.datasets.train.augmentations: her_transforms
  - /ml: mammaprint
  - /ml/optimizer: adam
  - /ml/net: vgg16
  - /ml/output_activation: sigmoid
  - /ml/loss: bce
  - /ml/metrics:
    - binary_accuracy
    - binary_auroc
    - binary_recall
    - binary_specificity
  - /ml/lr_scheduler: list_lr
  - /trainer/callbacks:
    - log_best_model
    - lr_monitor
  - _self_

datamodule:
  data_sources:
    mammaprint:
      splits:
        train: 1

  datasets:
    train:
      sampler:
        epoch_size: 20_000
        index_levels:
          - class_id
          - slide_name

  dataloaders_kwargs:
    train:
      num_workers: 8
      batch_size: 32

ml:
  net:
    features:
      weights: IMAGENET1K_V1
  optimizer:
    lr: 5e-5
    weight_decay: 5e-05
  lr_scheduler:
    scheduler:
      lr_list: 
        - ${ml.optimizer.lr}

trainer:
  max_epochs: 50
  log_every_n_steps: 20
  logger:
    log_model: all
  callbacks:
    log_best_model:
      monitor: train/binary_auroc
      mode: max
      filename: vgg16_mammaprint_best
  limit_val_batches: 0

metadata:
  experiment_name: Mamma-print
  run_name: VGG16 training
  description: |
    Luminal binary classification.
    The goal is to train VGG16 model without a validation set.
  hyperparameters:
    # Scaled for V40 GPU
    # tested with 24 GiB Memory, 8 cpus (set request=limits in k8s)
    # Expect around 50tiles/s
    # most time is spent in reading WSI regions (tiles) from disk
    max_epochs: ${trainer.max_epochs}
    train_epoch_size: ${datamodule.datasets.train.sampler.epoch_size}
    lr: ${ml.optimizer.lr}
    weight_decay: ${ml.optimizer.weight_decay}
    batch_size: ${datamodule.dataloaders_kwargs.train.batch_size}
