# @package _global_
defaults:
  - /experiment/mammaprint_bc: test
  - /trainer/callbacks:
    - slide_prediction_optimizer
  - _self_


datamodule:
  datasets:
    test:
      sampler:
        index_levels:
          - slide_name
      label: "class_id"
  dataloaders_kwargs:
    test:
      num_workers: 12
      batch_size: 32

ml:
  net:
    model_uri: mlflow-artifacts:/17/3e47af6eb9d04f57be4cf5b537a319b4/artifacts/model/MLFlowModelCheckpoint/vgg16_mammaprint_best

trainer:
  callbacks:
    slide_prediction_optimizer:
      save_dir: slide_predictions
      mask_size_min: 1
      mask_size_max: 100
      ground_truth_col: luminal_id


metadata:
  experiment_name: Mamma-print
  run_name: After TC, Luminal-type VGG16 no overlap Testing optimizer, threshold 128, sample level 0
  description: |
    Luminal binary classification test with finding best threshold and mask size for whole slide predictions.
  hyperparameters:
    # tested with ~ 8 GiB Memory, 8 cpus
    batch_size: ${datamodule.dataloaders_kwargs.test.batch_size}
