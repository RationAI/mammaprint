# @package _global_
defaults:
  - /experiment/mammaprint_bc: test
  - /trainer/callbacks:
    - slide_prediction_optimizer
  - _self_


datamodule:
  datasets:
    test:
      sampler:
        index_levels:
          - slide_name
  dataloaders_kwargs:
    test:
      num_workers: 8
      batch_size: 40

ml:
  net:
    model_uri: mlflow-artifacts:/17/76440d4335964988b7f53e489e838231/artifacts/model/MLFlowModelCheckpoint/resnet101_mammaprint_best

trainer:
  callbacks:
    slide_prediction_optimizer:
      save_dir: slide_predictions
      mask_size_min: 1
      mask_size_max: 100
      ground_truth_col: class_id


metadata:
  experiment_name: Mamma-print
  run_name: Luminal-type After segmentation ResNet101 Testing optimizer
  description: |
    Luminal binary classification test with finding best threshold and mask size for whole slide predictions.
  hyperparameters:
    # tested with ~ 8 GiB Memory, 8 cpus
    batch_size: ${datamodule.dataloaders_kwargs.test.batch_size}
