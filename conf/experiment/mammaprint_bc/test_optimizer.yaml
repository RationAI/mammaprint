# @package _global_
defaults:
  - /experiment/mammaprint_bc: test
  - /trainer/callbacks:
    - slide_prediction_optimizer
  - _self_


datamodule:
  datasets:
    test:
      sampler:
        index_levels:
          - slide_name
      label: "luminal_id"
  dataloaders_kwargs:
    test:
      num_workers: 8
      batch_size: 40

ml:
  net:
    model_uri: mlflow-artifacts:/17/7c625a1732044e1e920627759e4432d3/artifacts/model/MLFlowModelCheckpoint/vgg16_mammaprint_best

trainer:
  callbacks:
    slide_prediction_optimizer:
      save_dir: slide_predictions
      mask_size_min: 1
      mask_size_max: 100
      ground_truth_col: luminal_id


metadata:
  experiment_name: Mamma-print
  run_name: After TC, Luminal-type VGG16 no overlap Testing optimizer
  description: |
    Luminal binary classification test with finding best threshold and mask size for whole slide predictions.
  hyperparameters:
    # tested with ~ 8 GiB Memory, 8 cpus
    batch_size: ${datamodule.dataloaders_kwargs.test.batch_size}
