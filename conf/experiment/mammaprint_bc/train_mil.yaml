# @package _global_
defaults:
  - /datamodule: wsi
  # Train dataset
  - /datamodule/datasets@datamodule.datasets.train: mil_dataset
  - /datamodule/datasets/sampler@datamodule.datasets.train.sampler: mil_tree
  - /datamodule/datasets/augmentations@datamodule.datasets.train.augmentations: train_transforms
  # Valid dataset
  - /datamodule/datasets@datamodule.datasets.valid: mil_dataset
  - /datamodule/datasets/sampler@datamodule.datasets.valid.sampler: mil_tree
  - /datamodule/datasets/augmentations@datamodule.datasets.valid.augmentations: normalize
  - /ml: mammaprint
  - /ml/optimizer: adam
  - /ml/net: attmil
  - /ml/output_activation: sigmoid
  - /ml/loss: bce
  - /ml/metrics:
    - binary_accuracy
    - binary_auroc
    - binary_recall
    - binary_specificity
  - /ml/lr_scheduler: reduce_lr_on_plateau
  - /trainer/callbacks:
    - log_best_model
    - early_stopping
    - lr_monitor
  - _self_

datamodule:
  data_sources:
    blue-print:
      _target_: mammaprint.datamodule.datasources.WSIDataSource
      seed: ${seed}
      data_uris:
      # - mlflow-artifacts:/17/f2e3497d086c4849b331a05ecbe0f1fb/artifacts/dataset #resnet50 features
      # Prostate dataset
      # - mlflow-artifacts:/17/3220ae78cb7043608730d5ac00007d95/artifacts/dataset
      # - mlflow-artifacts:/17/f0251bfc7bbe41d8a43c469e62115965/artifacts/dataset
      # - mlflow-artifacts:/17/e4dbafc779604085974b6ea97cfa527e/artifacts/dataset
      # - mlflow-artifacts:/17/dd1ce182cf0c4d07aeb243c830e08894/artifacts/dataset
      #  - mlflow-artifacts:/17/4edc051a929648e78186b9ebe5cdd23d/artifacts/dataset
      #  - mlflow-artifacts:/17/32b5b152dba44ae1a753b51016308251/artifacts/dataset
      #mammaprint dataset
      - mlflow-artifacts:/17/7b8d9f92a8c848cf9fc3c69d736fdab8/artifacts/dataset
      splits:
        train: 0.8
        valid: 0.2

  datasets:
    train:
      sampler:
        epoch_size: 80
        index_levels:
          - slide_name
      label: "luminal_id"
    valid:
      sampler:
        epoch_size: 20
        index_levels:
          - slide_name
      label: "luminal_id"

  dataloaders_kwargs:
    train:
      num_workers: 12
      batch_size: 12
    valid:
      num_workers: 12
      batch_size: 12

ml:
  optimizer:
    lr: 5e-5
    weight_decay: 5e-05
  lr_scheduler:
    monitor: valid/loss
    scheduler:
      mode: min
      factor: 0.5
      patience: 3

trainer:
  max_epochs: 300
  log_every_n_steps: 1
  logger:
    log_model: all
  callbacks:
    early_stopping:
      monitor: valid/binary_auroc
      mode: max
      patience: 7
    log_best_model:
      monitor: valid/binary_auroc
      mode: max
      filename: MIL_binary_best


metadata:
  experiment_name: Mamma-print
  run_name: MIL gated attention Luminal binary classification
  description: |
   Luminal binary classification. MIL approach
  hyperparameters:
    # Scaled for V40 GPU
    # tested with 24 GiB Memory, 8 cpus (set request=limits in k8s)
    # Expect around 50tiles/s
    # most time is spent in reading WSI regions (tiles) from disk
    max_epochs: ${trainer.max_epochs}
    train_epoch_size: ${datamodule.datasets.train.sampler.epoch_size}
    valid_epoch_size: ${datamodule.datasets.valid.sampler.epoch_size}
    lr: ${ml.optimizer.lr}
    weight_decay: ${ml.optimizer.weight_decay}
    batch_size: ${datamodule.dataloaders_kwargs.train.batch_size}
