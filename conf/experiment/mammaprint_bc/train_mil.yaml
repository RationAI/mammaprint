# @package _global_
defaults:
  - /datamodule: wsi
  # Train dataset
  - /datamodule/datasets@datamodule.datasets.train: mil_dataset
  - /datamodule/datasets/sampler@datamodule.datasets.train.sampler: mil_tree
  - /datamodule/datasets/augmentations@datamodule.datasets.train.augmentations: train_transforms
  # Valid dataset
  - /datamodule/datasets@datamodule.datasets.valid: mil_dataset
  - /datamodule/datasets/sampler@datamodule.datasets.valid.sampler: mil_tree
  - /datamodule/datasets/augmentations@datamodule.datasets.valid.augmentations: normalize
  - /ml: mammaprint
  - /ml/optimizer: adam
  - /ml/net: attmil
  - /ml/output_activation: sigmoid
  - /ml/loss: bce
  - /ml/metrics:
    - binary_accuracy
    - binary_auroc
    - binary_recall
    - binary_specificity
  - /ml/lr_scheduler: reduce_lr_on_plateau
  - /trainer/callbacks:
    - log_best_model
    - early_stopping
    - lr_monitor
  - _self_

datamodule:
  data_sources:
    blue-print:
      _target_: mammaprint.datamodule.datasources.WSIDataSource
      seed: ${seed}
      data_uris:
      - mlflow-artifacts:/17/da9f024af5ec48d0a41c8e2f43a5529a/artifacts/activations
      - mlflow-artifacts:/17/854fc86cef41492784a04ff54f358e02/artifacts/activations
      - mlflow-artifacts:/17/c8826a9fe46c4c349a30e222b523314f/artifacts/activations
      - mlflow-artifacts:/17/10467994f85b4a118efb446ee5ae3852/artifacts/activations
      splits:
        train: 0.8
        valid: 0.2

  datasets:
    train:
      sampler:
        epoch_size: 80
        index_levels:
          - slide_name
    valid:
      sampler:
        epoch_size: 20
        index_levels:
          - slide_name

  dataloaders_kwargs:
    train:
      num_workers: 6
      batch_size: 6
    valid:
      num_workers: 6
      batch_size: 6

ml:
  optimizer:
    lr: 1e-5
    weight_decay: 5e-05
  lr_scheduler:
    monitor: valid/loss
    scheduler:
      mode: min
      factor: 0.5
      patience: 5

trainer:
  max_epochs: 300
  log_every_n_steps: 1
  logger:
    log_model: all
  callbacks:
    early_stopping:
      monitor: valid/binary_auroc
      mode: max
      patience: 5
    log_best_model:
      monitor: valid/binary_auroc
      mode: max
      filename: MIL_Luminal_best


metadata:
  experiment_name: Mamma-print
  run_name: MIL Prostate binary classification.
  description: |
   Prostate binary classification. MIL approach
  hyperparameters:
    # Scaled for V40 GPU
    # tested with 24 GiB Memory, 8 cpus (set request=limits in k8s)
    # Expect around 50tiles/s
    # most time is spent in reading WSI regions (tiles) from disk
    max_epochs: ${trainer.max_epochs}
    train_epoch_size: ${datamodule.datasets.train.sampler.epoch_size}
    valid_epoch_size: ${datamodule.datasets.valid.sampler.epoch_size}
    lr: ${ml.optimizer.lr}
    weight_decay: ${ml.optimizer.weight_decay}
    batch_size: ${datamodule.dataloaders_kwargs.train.batch_size}
