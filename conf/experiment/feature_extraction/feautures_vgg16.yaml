# @package _global_
defaults:
  - /datamodule: wsi
  - /datamodule/datasets@datamodule.datasets.test: base_dataset
  - /datamodule/datasets/sampler@datamodule.datasets.test.sampler: sequential_tree
  - /datamodule/datasets/augmentations@datamodule.datasets.test.augmentations: normalize
  - /ml: mammaprint
  - /ml/net: vgg16_feature_extractor
  - /ml/output_activation: identity
  - /trainer/callbacks:
    - prediction_saver
  - _self_


datamodule:
  data_sources:
    mammaprint:
      _target_: mammaprint.datamodule.datasources.WSIDataSource
      seed: ${seed}
      data_uris:
        # - mlflow-artifacts:/17/9685f514faf245309a7236df050b373d/artifacts/dataset  # segmentation mammaprint test dataset
        # - mlflow-artifacts:/17/c45e6afffccc490fa3a4bf1be2c986bd/artifacts/dataset  # mammaprint another dataset
        - mlflow-artifacts:/17/f954a11118f94723b6705192152aaf60/artifacts/data # mammaprint test dataset
        # - mlflow-artifacts:/17/29498aa547514d0c969d8e2646b31e7c/artifacts/dataset # mammaprint train dataset
        # - mlflow-artifacts:/4/42a6acd9b91942b4838646b6e9a2c158/artifacts/dataset #prostate dataset
      splits:
        test: 1.0
  datasets:
    test:
      label: "class_id"
      sampler:
        index_levels:
          - slide_name

  dataloaders_kwargs:
    test:
      num_workers: 10
      batch_size: 60
ml:
  net:
    features:
      weights: DEFAULT
trainer:
  callbacks:
    prediction_saver:
      save_dir: dataset

metadata:
  experiment_name: Mamma-print
  run_name: Mammaprint features extraction using VGG16, train dataset, After TC VGG16
  description: |
   TC Luminal-type train dataset - from best model, sample level 1, level 0, threshold 128 
  hyperparameters:
    batch_size: ${datamodule.dataloaders_kwargs.test.batch_size}
