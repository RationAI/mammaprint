# @package _global_
defaults:
  - /datamodule: wsi
  - /datamodule/datasets@datamodule.datasets.test: base_classification
  - /datamodule/datasets/sampler@datamodule.datasets.test.sampler: sequential_tree
  - /datamodule/datasets/augmentations@datamodule.datasets.test.augmentations: normalize
  - /ml: mammaprint
  - /ml/net: vgg16_feature_extractor
  - /ml/output_activation: identity
  - /trainer/callbacks:
    - prediction_saver
  - _self_


datamodule:
  data_sources:
    mammaprint:
      _target_: mammaprint.datamodule.datasources.WSIDataSource
      seed: ${seed}
      data_uris:
        - mlflow-artifacts:/17/b2494c6d09e04faca310bf3b27ab7642/artifacts/dataset  # mammaprint train dataset
        # - mlflow-artifacts:/17/f0a1d1b8cfc84493bb3924ad085e7c08/artifacts/dataset  # mammaprint another dataset
      splits:
        test: 1.0
  datasets:
    test:
      sampler:
        index_levels:
          - slide_name

  dataloaders_kwargs:
    test:
      num_workers: 10
      batch_size: 40

trainer:
  callbacks:
    prediction_saver:
      save_dir: dataset

metadata:
  experiment_name: Mamma-print
  run_name: Train and Another set features extraction using VGG16
  description: |
    Compute features using VGG16 model using large tiles from train and another set.
  hyperparameters:
    batch_size: ${datamodule.dataloaders_kwargs.test.batch_size}
