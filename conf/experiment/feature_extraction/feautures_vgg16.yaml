# @package _global_
defaults:
  - /datamodule: wsi
  - /datamodule/datasets@datamodule.datasets.test: base_classification
  - /datamodule/datasets/sampler@datamodule.datasets.test.sampler: sequential_tree
  - /datamodule/datasets/augmentations@datamodule.datasets.test.augmentations: normalize
  - /ml: mammaprint
  - /ml/net: vgg16_feature_extractor
  - /ml/output_activation: identity
  - /trainer/callbacks:
    - prediction_saver
  - _self_


datamodule:
  data_sources:
    mammaprint:
      _target_: mammaprint.datamodule.datasources.WSIDataSource
      seed: ${seed}
      data_uris:
        -  mlflow-artifacts:/17/888562b2d4b04d6e9b41be8c8685f1b3/artifacts/dataset  # mammaprint test dataset
      splits:
        test: 1.0
  datasets:
    test:
      sampler:
        index_levels:
          - slide_name

  dataloaders_kwargs:
    test:
      num_workers: 8
      batch_size: 40

ml:
  net:
    features:
      model_uri: mlflow-artifacts:/5/1f40fa1d82574ad8a4c18aa62ac52764/artifacts/model/MLFlowModelCheckpoint/vgg16_prostate_best
trainer:
  callbacks:
    prediction_saver:
      save_dir: dataset

metadata:
  experiment_name: Mamma-print
  run_name: Test features extraction
  description: |
    Compute features using VGG16 model trained on prostate.
  hyperparameters:
    batch_size: ${datamodule.dataloaders_kwargs.test.batch_size}
