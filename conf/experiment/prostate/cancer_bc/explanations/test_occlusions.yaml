# @package _global_
defaults:
  - prostate/cancer_bc: test
  - /trainer/callbacks: occlusion_explainer
  - /image_builder: dist_mapped_patch_assembler
  - _self_

datamodule:
  dataloaders_kwargs:
    test:
      num_workers: 5
      batch_size: 8

trainer:
  callbacks:
      base_explainer:
      save_dir: test_occlusion
      sliding_window_shapes: [ 3,55,55 ]
      strides: 27
      baselines: -1.0
      target: 0
      perturbations_per_eval: 30
      show_progress: false
  inference_mode: false


metadata:
  experiment_name: Prostate
  run_name: VGG16 Occlusion explain test
  description: Prostate cancer binary classification test with occlusion explanations generation.
  hyperparameters:
    num_workers: ${datamodule.dataloaders_kwargs.test.num_workers}
    batch_size: ${datamodule.dataloaders_kwargs.test.batch_size}
    xai_batch_size: ${trainer.callbacks.base_explainer.perturbations_per_eval}
