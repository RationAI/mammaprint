# @package _global_
defaults:
  - /datamodule: ki67
  - /datamodule/data_sources: ki67_test
  - /datamodule/datasets/augmentations@datamodule.transform: normalize
  - /ml: histopipe
  - /ml/optimizer: adam
  - /ml/net: saved_model
  - /ml/output_activation: identity
  - /ml/loss: mse
  - /ml/metrics: 
    - r2_score
    - pearson_corr_coef
    - spearman_corr_coef
    - mse
    - mae
    - ki67_accuracy
    - ki67_f1score
    - ki67_precision
    - ki67_recall
    - ki67_specificity
  - _self_


datamodule:
  dataloaders_kwargs:
    test:
      num_workers: 8
      batch_size: 16

ml:
  net:
    model_uri: mlflow-artifacts:/13/97b71448101342a5bca6675888591d6d/artifacts/model/MLFlowModelCheckpoint/vgg16_regression_best
  metrics:
    ki67_accuracy:
      thresholds: [2, 20]
    ki67_f1score:
      thresholds: ${..ki67_accuracy.thresholds}
    ki67_precision:
      thresholds: ${..ki67_accuracy.thresholds}
    ki67_recall:
      thresholds: ${..ki67_accuracy.thresholds}
    ki67_specificity:
      thresholds: ${..ki67_accuracy.thresholds}

metadata:
  experiment_name: Ki67
  run_name: VGG16_regression_test
  description: Attempting to estimate Ki67 positivity in breast carcinomas IHC
  hyperparameters:
    batch_size: ${datamodule.dataloaders_kwargs.test.batch_size}
    num_workers: ${datamodule.dataloaders_kwargs.test.num_workers}
    test_split: ${datamodule.data_sources.splits.test}

