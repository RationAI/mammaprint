# @package _global_
defaults:
  - /datamodule: wsi
  - /datamodule/data_sources:
    - TCGA_train_128
  - /datamodule/datasets@datamodule.datasets.train: base_contrastive
  - /datamodule/datasets/sampler@datamodule.datasets.train.sampler: random_filter_tree
  - /datamodule/datasets/augmentations@datamodule.datasets.train.augmentations: contrastive
  - /datamodule/datasets@datamodule.datasets.valid: base_contrastive
  - /datamodule/datasets/sampler@datamodule.datasets.valid.sampler: random_filter_tree
  - /datamodule/datasets/augmentations@datamodule.datasets.valid.augmentations: contrastive
  - /ml: contrastive
  - /ml/optimizer: lars
  - /ml/net: simclr2
  - /ml/metrics@ml.metrics.top1_accuracy: topk_accuracy
  - /ml/metrics@ml.metrics.top5_accuracy: topk_accuracy
  - /ml/loss: contrastive_loss
  - /ml/lr_scheduler: reduce_lr_on_plateau
  - /trainer/callbacks:
    - log_best_model
    - lr_monitor
    - early_stopping
  - _self_
   
datamodule:
  data_sources:
    prostate:
      splits:
        train: 0.8
        valid: 0.2

  datasets:
    train:
      seed: ${seed}
      extended_selection: false
      sampler:
        strict: false
        target_label: muscle # we don't really care about what class is here, we want to avoid label of type object
        epoch_size: 5_000
        index_levels: []
    valid:
      extended_selection: false
      sampler:
        strict: false
        target_label: muscle # we don't really care about what class is here, we want to avoid label of type object
        epoch_size: 5_000
        index_levels: []

  dataloaders_kwargs:
    train:
      num_workers: 8
      batch_size: 512
    valid:
      num_workers: 8
      batch_size: 512

ml:
  net:
    extractor_uri: "runs:/dd857080485c42a08d2789ec8ac9f2f2/resnet"
    projection_uri: "runs:/dd857080485c42a08d2789ec8ac9f2f2/head" 
  loss:
    temperature: 1.0
  optimizer:
    lr: 1e-4
    weight_decay: 1e-6
  lr_scheduler:
    monitor: valid/loss
    scheduler:
      mode: min
      factor: 0.5
      patience: 3
  metrics:
    top1_accuracy:
      _target_: histopipe.ml.metrics.ContrastiveTopK
      k: 1
    top5_accuracy:
      _target_: histopipe.ml.metrics.ContrastiveTopK
      k: 5

trainer:
  max_epochs: 1000
  log_every_n_steps: 20
  logger:
    log_model: all
  callbacks:
    early_stopping:
      monitor: valid/loss
      mode: min
      patience: 5
    log_best_model:
      monitor: valid/loss
      mode: min
      filename: vgg16_prostate_contrastive_best



metadata:
  experiment_name: SimCLR Fine tunning 
  run_name: Pretraining ResNet - 128@LARS 
  description: Pretraining of SimCLR2 with ResNet on TCGA dataset. Initial weights from original SimCLR2.
  hyperparameters:
    max_epochs: ${trainer.max_epochs}
    train_epoch_size: ${datamodule.datasets.train.sampler.epoch_size}
    valid_epoch_size: ${datamodule.datasets.valid.sampler.epoch_size}
    lr: ${ml.optimizer.lr}
    weight_decay: ${ml.optimizer.weight_decay}
    batch_size: ${datamodule.dataloaders_kwargs.train.batch_size}
