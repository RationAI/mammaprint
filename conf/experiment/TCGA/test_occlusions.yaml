# @package _global_
defaults:
  - TCGA/test: test_con
  - /trainer/callbacks: occlusion_explainer
  - /image_builder: dist_mapped_patch_assembler
  - _self_

datamodule:
  dataloaders_kwargs:
    test:
      num_workers: 5
      batch_size: 1

trainer:
  callbacks:
      base_explainer:
        save_dir: test_occlusion
        sliding_window_shapes: [ 3,55,55 ]
        strides: 27
        baselines: -1.0
        target: 0
        perturbations_per_eval: 100
        show_progress: false
  inference_mode: true


metadata:
  experiment_name: Tissue Classification
  run_name: VGG16 - Connective Tissue - Occlusion
  description: Tissue classification with occlusion explanations generation on TCGA dataset and a VGG16 model trained on Connective Tissue class.
  hyperparameters:
    num_workers: ${datamodule.dataloaders_kwargs.test.num_workers}
    batch_size: ${datamodule.dataloaders_kwargs.test.batch_size}
    xai_batch_size: ${trainer.callbacks.base_explainer.perturbations_per_eval}
