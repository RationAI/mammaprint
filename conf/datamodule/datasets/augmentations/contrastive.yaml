_target_: albumentations.Compose
p: 1.0 # default
transforms:
  - _target_: albumentations.RandomRotate90
    p: 0.75
  - _target_: albumentations.Flip
    p: 0.5  # default
  - _target_: albumentations.Resize # Resize for resnet input
    height: 224
    width: 224
  - _target_: albumentations.ColorJitter
    brightness: 0.5
    contrast: 0.5
    saturation: 0.5
    hue: 0.1
    p: 0.8
  - _target_: albumentations.GaussianBlur
    blur_limit: 9
    sigma_limit: 2
    p: 0.5
  - _target_: albumentations.Normalize
    mean: 0.5
    std: 0.5
    max_pixel_value: 255
    p: 1.0  # default
