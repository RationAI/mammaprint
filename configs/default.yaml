defaults:
  - hydra: default
  - logger: mlflow
  - /data/datasets@data.train: mammaprint/train
  - /data/datasets@data.val: mammaprint/val
  - /data/datasets@data.test: mammaprint/test
  - /data/datasets@data.predict: mammaprint/predict
  - /model/backbone: ???
  - _self_

seed: ${random_seed:}
mode: ???
checkpoint: null

trainer:
  enable_checkpointing: True
  max_epochs: 30
  log_every_n_steps: 5
  limit_train_batches: 0.05
  limit_val_batches: 0.1
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      save_top_k: 1
      monitor: validation/loss
      mode: min

data:
  batch_size: 32
  num_workers: 8

metadata:
  experiment_name: Mamma-print
  run_name: Luminal-type training
  description: Training a model on the luminal-type dataset
  hyperparams: {}
