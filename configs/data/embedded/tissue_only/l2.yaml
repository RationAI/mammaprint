# @package dataset.levels.2
# Level-2 EMBEDDINGS card (tissue masks) — precomputed Virchow2 features.
# Physical facts come from /data/levels/l2; only name + URIs live here.
# `uris.all` is the whole (un-split) embeddings artifact written by the
# embeddings step. Per-split URIs are produced from it by:
#   python scripts/preprocessing/split_dataset.py --kind embedded \
#     --uri <the `all` URI below> --name l2_tissue_embed
defaults:
  - /data/levels/l2@_here_
  - _self_

name: l2_tissue_embed
uris:
  all: "mlflow-artifacts:/3/<run_id>/artifacts/l2_tissue_embed"
  train: "mlflow-artifacts:/3/<run_id>/artifacts/l2_tissue_embed_train"
  val: "mlflow-artifacts:/3/<run_id>/artifacts/l2_tissue_embed_val"
  test: "mlflow-artifacts:/3/<run_id>/artifacts/l2_tissue_embed_test"
