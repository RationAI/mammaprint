# @package _global_
# Compose existing embedding cards; this file introduces no artifact copies/URIs.
defaults:
  - /data/embedded/tissue_only/l3@dataset.levels.3
  - /data/embedded/tissue_only/l4@dataset.levels.4
  - /data/embedded/tissue_only/l5@dataset.levels.5
  - _self_

pyramid:
  dataset_family: tissue_only
  anchor_level: 5
  level_order: [5, 4, 3]
  level_ratios: [1, 2, 4]
  tile_extent: 224
  require_complete: true
  overlap_policy: non_overlapping
  selection_seed: 0
