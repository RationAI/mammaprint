# @package _global_
# Reuse final per-level embedding cards and their predefined train/val/test splits.
defaults:
  - /data/embedded/epithel_or_cancer_5/l3@dataset.levels.3
  - /data/embedded/epithel_or_cancer_5/l4@dataset.levels.4
  - /data/embedded/epithel_or_cancer_5/l5@dataset.levels.5
  - _self_

pyramid:
  dataset_family: epithel_or_cancer_5
  anchor_level: 5
  level_order: [5, 4, 3]
  level_ratios: [1, 2, 4]
  tile_extent: 224
  require_complete: true
  overlap_policy: non_overlapping
  selection_seed: 0
