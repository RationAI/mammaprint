# @package _global_
# Raw-tile data shape: DataModule over RawTileSlideDataset (image bags).
# An experiment pulls this in and exposes an optional data/tiled card slot.
# Select exactly one artifact card at launch, e.g. data/tiled=demo_l3_tiled.
# Dataset spec written once (&dataset on `train`); val/test override only `split`.
dataset:
  levels: ???            # filled by the selected data/tiled/* card
  data_mapping: ${project_path}/data_mapping.csv
  max_tiles: 256         # per-slide tile cap (random-sampled if exceeded)

datamodule:
  _target_: ml.data.DataModule
  batch_size: 1
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  train: &dataset
    _target_: ml.data.RawTileSlideDataset
    split: train
    levels: ${dataset.levels}
    data_mapping: ${dataset.data_mapping}
    label_mode: ${label_mode}
    max_tiles: ${dataset.max_tiles}
    seed: ${seed}
  val:
    <<: *dataset
    split: val
  test:
    <<: *dataset
    split: test
