# @package _global_
# Single-scale data shape: DataModule over SingleScaleDataset (flat embedding bags).
# An experiment pulls this in and exposes an optional data/embedded card slot.
# Select exactly one artifact card at launch, e.g. data/embedded=demo_l3_embed.
# The dataset spec is written ONCE (the &dataset anchor on `train`); val/test merge
# it and override only `split`. Splits are built lazily per stage in DataModule.setup.
dataset:
  levels: ???            # filled by the selected data/embedded/* card
  data_mapping: ${project_path}/data_mapping.csv

datamodule:
  _target_: ml.data.DataModule
  batch_size: 1
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  train: &dataset
    _target_: ml.data.SingleScaleDataset
    split: train
    levels: ${dataset.levels}
    data_mapping: ${dataset.data_mapping}
    label_mode: ${label_mode}
  val:
    <<: *dataset
    split: val
  test:
    <<: *dataset
    split: test
  predict:
    <<: *dataset
    split: ${predict_split}
