# @package dataset.levels.2
# Level-2 RAW-TILE card (cancer_mask masks). Physical facts come from
# /data/levels/l2; only the variant name + artifact URIs live here.
# `raw_uris.all` is the whole (un-split) tiled artifact read by the embeddings
# step. Per-split URIs are produced from it by:
#   python scripts/preprocessing/split_dataset.py --kind tiled \
#     --uri <the `all` URI below> --name l2_cancer_mask
defaults:
  - /data/levels/l2@_here_
  - _self_

name: l2_cancer_mask
raw_uris:
  all: "mlflow-artifacts:/3/698ec2dcda3a4b7aa57b250dbbbfaec0/artifacts/mou_2_224_cancer_mask"
  train: "mlflow-artifacts:/3/<run_id>/artifacts/l2_cancer_mask_train"
  val: "mlflow-artifacts:/3/<run_id>/artifacts/l2_cancer_mask_val"
  test: "mlflow-artifacts:/3/<run_id>/artifacts/l2_cancer_mask_test"
