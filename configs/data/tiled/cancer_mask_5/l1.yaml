# @package dataset.levels.1
# Level-1 RAW-TILE card (cancer_mask masks). Physical facts come from
# /data/levels/l1; only the variant name + artifact URIs live here.
# `raw_uris.all` is the whole (un-split) tiled artifact read by the embeddings
# step. Per-split URIs are produced from it by:
#   python scripts/preprocessing/split_dataset.py --kind tiled \
#     --uri <the `all` URI below> --name l1_cancer_mask
defaults:
  - /data/levels/l1@_here_
  - _self_

name: l1_cancer_mask
raw_uris:
  all: "mlflow-artifacts:/3/7651a68400f6484db36d3626b1d64e83/artifacts/mou_1_224_cancer_mask"
  train: "mlflow-artifacts:/3/<run_id>/artifacts/l1_cancer_mask_train"
  val: "mlflow-artifacts:/3/<run_id>/artifacts/l1_cancer_mask_val"
  test: "mlflow-artifacts:/3/<run_id>/artifacts/l1_cancer_mask_test"
