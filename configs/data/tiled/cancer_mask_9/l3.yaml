# @package dataset.levels.3
# Level-3 RAW-TILE card (cancer_mask masks). Physical facts come from
# /data/levels/l3; only the variant name + artifact URIs live here.
# `raw_uris.all` is the whole (un-split) tiled artifact read by the embeddings
# step. Per-split URIs are produced from it by:
#   python scripts/preprocessing/split_dataset.py --kind tiled \
#     --uri <the `all` URI below> --name l3_cancer_mask
defaults:
  - /data/levels/l3@_here_
  - _self_

name: l3_cancer_mask
raw_uris:
  all: "mlflow-artifacts:/3/182661b3b71c4f2d9a684d700f55dc7b/artifacts/mou_3_224_cancer_mask"
  train: "mlflow-artifacts:/3/<run_id>/artifacts/l3_cancer_mask_train"
  val: "mlflow-artifacts:/3/<run_id>/artifacts/l3_cancer_mask_val"
  test: "mlflow-artifacts:/3/<run_id>/artifacts/l3_cancer_mask_test"
