# @package dataset.levels.2
# Level-2 RAW-TILE card (tissue masks). Physical facts come from
# /data/levels/l2; only the variant name + artifact URIs live here.
# `raw_uris.all` is the whole (un-split) tiled artifact read by the embeddings
# step. Per-split URIs are produced from it by:
#   python scripts/preprocessing/split_dataset.py --kind tiled \
#     --uri <the `all` URI below> --name l2_tissue
defaults:
  - /data/levels/l2@_here_
  - _self_

name: l2_tissue
raw_uris:
  all: "mlflow-artifacts:/3/0d8e51f080df435bbaa9b189b7973aac/artifacts/mou_2_224_tissue"
  train: "mlflow-artifacts:/3/<run_id>/artifacts/l2_tissue_train"
  val: "mlflow-artifacts:/3/<run_id>/artifacts/l2_tissue_val"
  test: "mlflow-artifacts:/3/<run_id>/artifacts/l2_tissue_test"
