# @package dataset.levels.4
# Level-4 RAW-TILE card (tissue masks). Physical facts come from
# /data/levels/l4; only the variant name + artifact URIs live here.
# `raw_uris.all` is the whole (un-split) tiled artifact read by the embeddings
# step. Per-split URIs are produced from it by:
#   python scripts/preprocessing/split_dataset.py --kind tiled \
#     --uri <the `all` URI below> --name l4_tissue
defaults:
  - /data/levels/l4@_here_
  - _self_

name: l4_tissue
raw_uris:
  all: "mlflow-artifacts:/3/46b689cdd7a2450ea5c2f997a86e4561/artifacts/mou_4_224_tissue"
  train: "mlflow-artifacts:/3/<run_id>/artifacts/l4_tissue_train"
  val: "mlflow-artifacts:/3/<run_id>/artifacts/l4_tissue_val"
  test: "mlflow-artifacts:/3/<run_id>/artifacts/l4_tissue_test"
