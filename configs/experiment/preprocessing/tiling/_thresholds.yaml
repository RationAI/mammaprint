# @package _global_
# Coverage cutoffs shared by every tiling experiment (keep tiles with overlap >
# threshold; higher overlap = cleaner). Defined once here and pulled into each
# tiling experiment via defaults. Chosen from the corrected coverage
# distributions in scripts/notebooks/mask_coverage_threshold.ipynb (mou_3_224 run):
#   tissue 0.25   - on-tissue floor (center-50% ROI); raise to 0.5 for stricter purity (drops ~13%).
#   blur   0.5    - drops the genuinely out-of-focus tail (~1% of tiles); lenient artifact gate.
#   folding 0.1   - kept lenient: folding masks are slide-inconsistent, so a low gate avoids uneven
#                   filtering while still removing majority-folded tiles.
#   residual 0.5  - drops heavily-contaminated tiles (some slides are ~66% residual artifact).
#   epithelium null - discovery mode: record epithelium coverage without filtering until a cutoff
#                    is selected from the threshold-scan dataset.
#   cancer 0.5    - keeps tiles with mean cancer probability above 0.5.
# Inherited across all levels; re-verify against a level's own distributions if
# you re-tile it (mask resolution differs by mpp) by overriding these in that
# experiment after `_thresholds` in its defaults list.
tissue_threshold: 0.25
blur_threshold: 0.5
folding_threshold: 0.1
residual_threshold: 0.5
epithelium_threshold: null
cancer_threshold: 0.5
