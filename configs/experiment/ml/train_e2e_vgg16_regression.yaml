# @package _global_
# End-to-end regression: VGG16 backbone over raw level-3 tiles -> mean-pool
# -> linear head (out_dim=1), regressing the MammaPrint index. Reads tile images
# via RawTileSlideDataset (OpenSlide). Same data/model as train_e2e_vgg16, but the
# regression task (label_mode=index, MSE, correlation metrics).
defaults:
  - /ml: module
  - /ml/encoder@ml.encoder: vgg16
  - /ml/aggregator@ml.aggregator: mean
  - /ml/head@ml.head: linear
  - /ml/output_activation@ml.output_activation: identity
  - /ml/loss@ml.loss: mse
  - /ml/optimizer@ml.optimizer: adam
  - /ml/lr_scheduler@ml.lr_scheduler: reduce_lr_on_plateau
  - /ml/metrics:
      - mae
      - mse
      - pearson
      - spearman
      - r2
      - thresholded_f1
      - thresholded_precision
      - thresholded_recall
      - thresholded_specificity
  - /trainer: default
  - /data: _template_raw
  - optional /data/tiled: null
  - _self_

label_mode: index
feature_dim: 512  # VGG16 global-max-pooled feature size

metadata:
  experiment_name: MammaPrint
  run_name: End-to-end VGG16 — MammaPrint index regression (raw tiles)
  description: |
    End-to-end regression of the continuous MammaPrint index with a VGG16 backbone
    over raw level-3 tiles and mean-pool aggregation.
  hyperparameters:
    encoder: ${ml.encoder._target_}
    aggregator: ${ml.aggregator._target_}
    loss: ${ml.loss._target_}
    lr: ${ml.optimizer.lr}
    batch_size: ${datamodule.batch_size}
    max_epochs: ${trainer.max_epochs}
