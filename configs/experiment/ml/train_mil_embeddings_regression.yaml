# @package _global_
# Linear head on precomputed level-3 embeddings, REGRESSION of the MammaPrint index:
# identity encoder (frozen embeddings) -> mean-pool -> linear head (out_dim=1).
# Regression twin of train_mil_embeddings (label_mode=index, MSE).
defaults:
  - /ml: module
  - /ml/encoder@ml.encoder: identity
  - /ml/aggregator@ml.aggregator: mean
  - /ml/head@ml.head: linear
  - /ml/output_activation@ml.output_activation: identity
  - /ml/loss@ml.loss: mse
  - /ml/optimizer@ml.optimizer: adam
  - /ml/lr_scheduler@ml.lr_scheduler: reduce_lr_on_plateau
  - /ml/metrics:
      - mae
      - mse
      - thresholded_f1
      - thresholded_precision
      - thresholded_recall
      - thresholded_specificity
  - /trainer: default
  - /data: _template
  - optional /data/embedded: null
  - _self_

label_mode: index
feature_dim: 2560  # Virchow2 embedding size

metadata:
  experiment_name: MammaPrint
  run_name: Linear head — MammaPrint index regression (level-3 Virchow2 embeddings)
  description: |
    Multiple-instance-learning regression of the continuous MammaPrint index over
    frozen per-slide level-3 Virchow2 tile embeddings, mean-pool aggregation + linear head.
  hyperparameters:
    encoder: ${ml.encoder._target_}
    aggregator: ${ml.aggregator._target_}
    head: ${ml.head._target_}
    loss: ${ml.loss._target_}
    lr: ${ml.optimizer.lr}
    batch_size: ${datamodule.batch_size}
    max_epochs: ${trainer.max_epochs}
