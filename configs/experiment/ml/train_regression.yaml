# @package _global_
# Regression of the MammaPrint index on precomputed level-3 embeddings: identity
# encoder -> mean-pool -> linear head (out_dim=1). Same data as train_mil_embeddings.
defaults:
  - /ml: module
  - /ml/encoder@ml.encoder: identity
  - /ml/aggregator@ml.aggregator: mean
  - /ml/head@ml.head: linear
  - /ml/output_activation@ml.output_activation: identity
  - /ml/loss@ml.loss: mse
  - /ml/optimizer@ml.optimizer: adam
  - /ml/lr_scheduler@ml.lr_scheduler: reduce_lr_on_plateau
  - /ml/metrics:
      - mae
      - mse
      - pearson
      - spearman
      - r2
  - /trainer: default
  - /data/sources: single_l3_embed
  - _self_

label_mode: index
feature_dim: 2560  # Virchow2 embedding size

metadata:
  experiment_name: MammaPrint
  run_name: Regression — MammaPrint index (level-3 Virchow2 embeddings)
  description: |
    Multiple-instance-learning regression of the continuous MammaPrint index over
    frozen per-slide level-3 Virchow2 tile embeddings, mean-pool + linear head.
  hyperparameters:
    aggregator: ${ml.aggregator._target_}
    loss: ${ml.loss._target_}
    lr: ${ml.optimizer.lr}
    batch_size: ${datamodule.batch_size}
    max_epochs: ${trainer.max_epochs}
