# @package _global_
# Shared training policy for complete three-level pyramid experiments.
defaults:
  - /ml: module
  - /ml/encoder@ml.encoder: identity
  - /ml/output_activation@ml.output_activation: identity
  - /ml/loss@ml.loss: bce
  - /ml/optimizer@ml.optimizer: adam
  - /ml/lr_scheduler@ml.lr_scheduler: reduce_lr_on_plateau
  - /ml/metrics:
      - binary_accuracy
      - binary_auroc
      - binary_f1
      - binary_precision
      - binary_recall
      - binary_specificity
  - /trainer: default
  - /data: _pyramid_template
  - /data/pyramid: tissue_only_l5_l4_l3
  - _self_

label_mode: type
feature_dim: 2560
multiscale_hidden_dim: 512
seed: 1729
test_after_fit: false

metadata:
  experiment_name: MammaPrint
  hyperparams:
    dataset_family: ${pyramid.dataset_family}
    level_order: ${pyramid.level_order}
    level_ratios: ${pyramid.level_ratios}
    tile_extent: ${pyramid.tile_extent}
    overlap_policy: ${pyramid.overlap_policy}
    selection_seed: ${pyramid.selection_seed}
    feature_adapter: ${ml.aggregator.feature_adapter}
    within_level: ${ml.aggregator.within_level}
    level_fusion: ${ml.aggregator.level_fusion}
    slide_pool: ${ml.aggregator.slide_pool}
    finalizer: ${ml.aggregator.finalizer}
    feature_dim: ${feature_dim}
    hidden_dim: ${multiscale_hidden_dim}
    slide_dim: ${slide_dim}
    head: ${ml.head._target_}
    loss: ${ml.loss._target_}
    training_seed: ${seed}
