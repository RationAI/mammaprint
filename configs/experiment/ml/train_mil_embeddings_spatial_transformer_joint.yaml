# @package _global_
# Multi-task spatially-aware transformer MIL on precomputed level-3 embeddings:
# identity encoder -> SpatialTransformerMIL (TransMIL self-attention + 2D sinusoidal
# PE from each tile's (x, y)) -> MLP head with out_dim=2. The head emits a class logit
# (col 0) and a regression scalar (col 1); JointLoss = w_cls * BCE(type) + w_reg *
# MSE(index) trains both at once. Coord-aware twin of
# train_mil_embeddings_transformer_joint (label_mode="both").
defaults:
  - /ml: module
  - /ml/encoder@ml.encoder: identity
  - /ml/aggregator@ml.aggregator: spatial_transformer
  - /ml/head@ml.head: linear
  - /ml/output_activation@ml.output_activation: identity
  - /ml/loss@ml.loss: joint
  - /ml/optimizer@ml.optimizer: adam
  - /ml/lr_scheduler@ml.lr_scheduler: reduce_lr_on_plateau
  - /ml/metrics:
      - joint_auroc
      - joint_f1
      - joint_mse
      - joint_pearson
  - /trainer: default
  - /data: _spatial_template
  - optional /data/embedded: null
  - _self_

label_mode: both
feature_dim: 2560  # Virchow2 embedding size (divisible by num_heads=8 and by 4)

# Tile footprint facts for the PE grid-normalisation, pulled from the level-3 card.
# extent = tile_extent * mpp (level-0 px). Change the level index if you swap cards.
spatial:
  mpp: ${dataset.levels.3.mpp}
  tile_extent: ${dataset.levels.3.tile_extent}

# Two outputs: [class logit, regression scalar].
ml:
  head:
    out_dim: 2

metadata:
  experiment_name: MammaPrint
  run_name: Spatial transformer MIL joint — luminal classification + MammaPrint index regression (level-3 Virchow2 embeddings)
  description: |
    Multi-task multiple-instance-learning over frozen per-slide level-3 Virchow2
    tile embeddings: TransMIL-style CLS-token self-attention with a 2D sinusoidal
    positional encoding built from each tile's physical (x, y) coordinate, + 2-output
    MLP head trained jointly on luminal type (BCE) and the continuous MammaPrint index
    (MSE) via JointLoss.
  hyperparameters:
    aggregator: ${ml.aggregator._target_}
    num_heads: ${ml.aggregator.num_heads}
    num_layers: ${ml.aggregator.num_layers}
    pe_scale: ${ml.aggregator.pe_scale}
    pe_span: ${ml.aggregator.pe_span}
    head: ${ml.head._target_}
    loss: ${ml.loss._target_}
    w_cls: ${ml.loss.w_cls}
    w_reg: ${ml.loss.w_reg}
    lr: ${ml.optimizer.lr}
    batch_size: ${datamodule.batch_size}
    max_epochs: ${trainer.max_epochs}
