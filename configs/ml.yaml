defaults:
  - base
  - _self_
  # Experiments select the data shape and model components.

seed: ${random_seed:}

# Lightning stage + checkpoint. Override for eval/inference, e.g.
#   mode=test checkpoint=/path/to/best.ckpt
mode: fit  # fit | validate | test | predict
checkpoint: null  # path to a .ckpt to resume (fit) or load weights (validate/test/predict)

# After a `fit` run, evaluate the best checkpoint on the test split so models are
# directly comparable on held-out data right after training. Ignored unless mode=fit.
test_after_fit: true

# Task shape — set per experiment. Single-output (out_dim=1) for the single-task
# modes: binary classification (label_mode=type, BCE + binary metrics) or
# regression (label_mode=index, MSE). The joint mode (label_mode=both) is
# multi-task: a 2-output head + JointLoss trains classification and regression
# together. No num_classes — the task is binary-or-regression.
label_mode: type  # "type" (classification), "index" (regression), "both" (joint)
feature_dim: ???  # tile-feature width = encoder.out_dim; set per experiment

# datamodule / ml / trainer are composed by the +experiment config's defaults.
