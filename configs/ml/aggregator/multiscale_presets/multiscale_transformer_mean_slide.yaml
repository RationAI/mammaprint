# @package _global_
defaults:
  - /ml/aggregator: multiscale_modular
  - /ml/head: linear
  - _self_

slide_dim: 1536
ml:
  aggregator:
    feature_adapter: shared_linear
    within_level: shared_transformer
    level_fusion: concat
    slide_pool: mean
    finalizer: null
    position_embedding: learned
    level_embedding: learned
  head:
    in_dim: ${slide_dim}
