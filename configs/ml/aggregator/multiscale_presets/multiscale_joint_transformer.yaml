# @package _global_
defaults:
  - /ml/aggregator: multiscale_modular
  - /ml/head: linear
  - _self_

slide_dim: 512
ml:
  aggregator:
    feature_adapter: shared_linear
    within_level: null
    level_fusion: joint_transformer
    slide_pool: gated_attention
    finalizer: null
    position_embedding: learned
    level_embedding: learned
  head:
    in_dim: ${slide_dim}
