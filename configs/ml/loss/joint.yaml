# Multi-task classification + regression on the `both` label mode.
# Combines BCEWithLogits (luminal type) and MSE (MammaPrint index):
#   total = w_cls * BCE(logit, type) + w_reg * MSE(scalar, index)
#
# Requires: head.out_dim=2 (col 0 = class logit, col 1 = regression scalar),
# output_activation=identity, and the dataset's label_mode="both".
# Tune w_cls / w_reg if one task dominates the gradient (the two terms live on
# different scales — BCE ~ O(1), MSE ~ the index variance).
_target_: ml.models.losses.JointLoss
w_cls: 1.0
w_reg: 1.0
pos_weight: null
