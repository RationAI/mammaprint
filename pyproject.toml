[project]
name = "mammaprint"
version = "0.1.0"
authors = [
    { name = "Michal Kišš", email = "550439@mail.muni.cz" },
    { name = "Matěj Pekár", email = "matejpekar@mail.muni.cz" },
]
requires-python = ">=3.12, <3.13"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "aiohttp>=3.13.1",
    "datasets>=3.0.0",
    "hydra-core>=1.3.2",
    "lightning>=2.5.5",
    "numpy>=2.0.0",
    "omegaconf>=2.3.0",
    "onnxruntime>=1.27,<1.30; sys_platform != 'linux'",
    "onnxruntime-gpu>=1.27,<1.30; sys_platform == 'linux'",
    "openslide-bin>=4.0.0.8",
    "openslide-python>=1.4.2",
    "pillow>=11.0.0",
    "pyvips[binary]>=3.0.0",
    "rationai-mlkit",
    "rationai-masks>=1.1.1",
    "rationai-tiling>=1.1.1",
    "ratiopath>=1.2.0",
    "rationai-sdk",
    "timm>=1.0.25",
]

[project.optional-dependencies]
submit = [
    "rationai-kube-jobs @ git+ssh://git@gitlab.ics.muni.cz/rationai/infrastructure/kube-jobs",
]

[dependency-groups]
dev = [
    "ruff>=0.14.1",
    "mypy>=1.19.1",
]

[tool.uv.sources]
rationai-masks = { git = "https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/masks.git" }
rationai-mlkit = { git = "https://github.com/RationAI/mlkit.git" }
rationai-tiling = { git = "https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/tiling.git" }
rationai-sdk = { git = "https://github.com/RationAI/rationai-sdk-python.git" } 
ratiopath = { git = "https://github.com/RationAI/ratiopath.git" }
